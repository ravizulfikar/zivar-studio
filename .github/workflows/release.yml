name: Release

# Push a tag such as v1.0.0 to build the installer and the portable exe and publish them as a GitHub Release.
# Run it by hand (Actions tab) to get the same files as downloadable artifacts, without publishing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      ZIVAR_TEST_SKIP_SERVERS: '1'
      # No code-signing certificate here: do not go looking for one.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version. Fix one of them and tag again."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build installer and portable exe
        run: npm run dist:ci

      - name: Checksums
        shell: bash
        working-directory: release
        run: |
          sha256sum ZivarStudio-*.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Keep the files as workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: zivar-studio-windows
          path: |
            release/ZivarStudio-Setup-*.exe
            release/ZivarStudio-Portable-*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          files=(release/ZivarStudio-Setup-*.exe release/ZivarStudio-Portable-*.exe release/SHA256SUMS.txt)
          flags=()
          case "$tag" in *-*) flags+=(--prerelease) ;; esac
          if gh release view "$tag" >/dev/null 2>&1; then
            # a re-run: replace the files of the existing release
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --title "Zivar Studio $tag" --generate-notes "${flags[@]}"
          fi
