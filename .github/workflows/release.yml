name: Release

# Push a tag such as v1.1.0 to build Zivar Database Studio for Windows and Linux and publish everything as one GitHub Release.
# Run it by hand (Actions tab) to get the same files as downloadable artifacts, without publishing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The hosted runners cannot be relied on to start throwaway PostgreSQL / MySQL servers.
  ZIVAR_TEST_SKIP_SERVERS: '1'
  # No code-signing certificate here: do not go looking for one.
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  windows:
    name: Build (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version. Fix one of them and tag again."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build installer and portable exe
        run: npm run dist:ci

      - name: Smoke test the packaged app
        shell: bash
        run: node tests/packaged-smoke.cjs "$PWD/release/win-unpacked/Zivar Database Studio.exe" "$(node -p "require('./package.json').version")" "Zivar Database Studio"

      - uses: actions/upload-artifact@v7
        with:
          name: zivar-windows
          path: |
            release/ZivarDatabaseStudio-Setup-*.exe
            release/ZivarDatabaseStudio-Portable-*.exe
          if-no-files-found: error

  linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: System packages (rpm tooling and a virtual display for the smoke test)
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm xvfb

      - run: npm ci

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version. Fix one of them and tag again."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build AppImage, deb and rpm
        run: npm run dist:linux

      - name: Smoke test the packaged app (virtual display)
        run: xvfb-run -a node tests/packaged-smoke.cjs "$PWD/release/linux-unpacked/zivar-database-studio" "$(node -p "require('./package.json').version")" "Zivar Database Studio"

      - name: Inspect the packages
        run: |
          ls -la release/*.AppImage release/*.deb release/*.rpm
          dpkg-deb --info release/*.deb
          rpm -qip release/*.rpm

      - uses: actions/upload-artifact@v7
        with:
          name: zivar-linux
          path: |
            release/ZivarDatabaseStudio-*-linux-*.AppImage
            release/ZivarDatabaseStudio-*-linux-*.deb
            release/ZivarDatabaseStudio-*-linux-*.rpm
          if-no-files-found: error

  deb-install:
    name: Install the .deb on ${{ matrix.image }}
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:12', 'debian:13', 'ubuntu:22.04', 'ubuntu:24.04']
    # A bare, minimal system: it only has what the package itself asks for.
    container: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Tools for the test itself (not for the app)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git xvfb xauth

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        with:
          name: zivar-linux
          path: assets

      - name: Install the package (apt resolves its dependencies from this distribution)
        run: |
          apt-get install -y --no-install-recommends ./assets/ZivarDatabaseStudio-*-linux-amd64.deb
          dpkg -s zivar-database-studio | grep -E '^(Package|Version|Architecture|Depends):'

      - name: The menu entry and the icon are installed
        run: |
          dpkg -L zivar-database-studio | grep -E '\.desktop$|/icons/|/usr/bin/' || true
          test -e /usr/share/applications/zivar-database-studio.desktop
          cat /usr/share/applications/zivar-database-studio.desktop

      - name: Every shared library the app needs is present
        run: |
          bin=$(readlink -f "$(command -v zivar-database-studio)")
          echo "binary: $bin"
          if ldd "$bin" | grep "not found"; then
            echo "::error::the package does not pull in the libraries listed above"
            exit 1
          fi
          echo "none missing"

      - name: Start the installed app and check it (virtual display)
        run: |
          version=$(node -p "require('./package.json').version")
          xvfb-run -a node tests/packaged-smoke.cjs "$(command -v zivar-database-studio)" "$version" "Zivar Database Studio"

      - name: Uninstall
        run: |
          apt-get remove -y zivar-database-studio
          ! command -v zivar-database-studio

  publish:
    name: Publish the GitHub Release
    needs: [windows, linux, deb-install]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: Checksums
        working-directory: assets
        run: |
          sha256sum ZivarDatabaseStudio-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          flags=()
          case "$tag" in *-*) flags+=(--prerelease) ;; esac
          if gh release view "$tag" >/dev/null 2>&1; then
            # a re-run: replace the files of the existing release
            gh release upload "$tag" assets/* --clobber
          else
            gh release create "$tag" assets/* --title "Zivar Database Studio $tag" --generate-notes "${flags[@]}"
          fi
